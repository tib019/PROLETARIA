version: '3.8'

# PROLETARIA — Gesamtstack
# Startet alle Module des Anti-Palantir Konglomerats
#
# docker compose up -d
# ANTI-KI API:       http://localhost:8000/docs
# LLM Server:        http://localhost:8001/docs
# OSINT Backend:     http://localhost:8002/docs
# Neo4j Browser:     http://localhost:7474
# Ollama:            http://localhost:11434

services:
  ollama:
    image: ollama/ollama:latest
    container_name: proletaria-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  neo4j:
    image: neo4j:5.18-community
    container_name: proletaria-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/proletaria_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G

  anti-ki:
    build:
      context: ./modules/anti-ki
      dockerfile: Dockerfile
    container_name: proletaria-antiki
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - neo4j
    environment:
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - chroma_data:/app/rag/chroma_db
      - ./opsec:/app/opsec  # PROLETARIA OPSEC-Module einbinden

  llm-server:
    build:
      context: ./llm-server
      dockerfile: Dockerfile
    container_name: proletaria-llm
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
      - PROLETARIA_MODEL=proletaria-llm

  osint:
    build:
      context: ./modules/osint/backend
      dockerfile: Dockerfile
    container_name: proletaria-osint
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      - neo4j

volumes:
  ollama_models:
  neo4j_data:
  chroma_data:
